function resize() {
  DPR = devicePixelRatio || 1;
  const iw = innerWidth, ih = innerHeight;
  cv.width = Math.round(iw * DPR); cv.height = Math.round(ih * DPR);
  cv.style.width = iw + 'px'; cv.style.height = ih + 'px';
  SC = Math.min(iw / W, ih / H); OX = (iw - W * SC) / 2; OY = (ih - H * SC) / 2;
  VX0 = -OX / SC; VY0 = -OY / SC; VX1 = W + OX / SC; VY1 = H + OY / SC;
}
addEventListener('resize', resize); resize();

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

let actx = null, noiseBuf = null;
function unlock() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}

function tone(f0, f1, dur, type = 'square', vol = 0.08) {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.2, freq = 1200) {
  if (!actx) return;
  if (!noiseBuf) {
    noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  const t = actx.currentTime, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(100, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f).connect(g).connect(actx.destination); s.start(t); s.stop(t + dur);
}

  const c = CTRL[i], ts = TAPS[i];

    left: hh(...c.l), right: hh(...c.r), up: hh(...c.u), down: hh(...c.d),

  }
  const waiting = net.busy || net.open || (host && !net.err);
  text(net.status + (waiting ? '.'.repeat((frame >> 4) % 4) : ''), W / 2, 430, 24, net.err ? '#ff8a8a' : '#dde', 'center', 700);
  let hint;
  if (net.dead) hint = 'Enter: try again  ·  Esc: menu';
  else if (net.err) hint = host ? 'Enter: retry  ·  Esc: back' : 'Fix the code, then Enter  ·  Esc: back';
  else if (host) hint = 'Your friend opens this same file, picks Online → Join a room, and types this code';
  else hint = net.busy || net.open ? 'Esc: cancel' : 'Type or paste the code  ·  Enter: connect  ·  Esc: back';
  text(hint, W / 2, 490, 18, '#ccd', 'center', 600);
  if (host && !net.err) text((net.copied && frame - net.copied < 90 ? 'Copied!' : 'C: copy code') + '  ·  Esc: back', W / 2, 524, 16, '#99a', 'center', 600);
  text('Finds your friend through the free PeerJS server, then plays peer-to-peer. The host runs the match.', W / 2, 668, 14, '#778', 'center', 600);
}

function draw() {
  ctx.setTransform(DPR * SC, 0, 0, DPR * SC, DPR * OX, DPR * OY);
  ctx.save();
  if (game.shake) ctx.translate(rnd(-game.shake, game.shake), rnd(-game.shake, game.shake));
  drawBG(); drawStage();
  const inGame = game.state !== 'menu' && game.state !== 'lobby';
  if (inGame) { drawProjs(); const sm = net.role === 'join' && isOnline(); if (sm) shiftF(1); F.forEach(drawFighter); if (sm) shiftF(-1); drawFx(); }
  ctx.restore();
  if (game.state === 'menu') { drawMenu(); return; }
  if (game.state === 'lobby') { drawLobby(); return; }
  drawHUD();
  if (game.count > 0) text(String(Math.ceil(game.count / 60)), W / 2, H / 2 - 60, 140, '#fff');
  else if (game.goT > 0) { ctx.globalAlpha = Math.min(1, game.goT / 15); text('GO!', W / 2, H / 2 - 60, 150, '#ffd35a'); ctx.globalAlpha = 1; }
  if (game.endT > 0 && game.winner) text('GAME!', W / 2, H / 2 - 60, 130, '#fff');
  if (game.state === 'pause') {
    ctx.fillStyle = '#0008'; ctx.fillRect(VX0, VY0, VX1 - VX0, VY1 - VY0);
    text('PAUSED', W / 2, H / 2 - 40, 90);
    text('Esc / Enter: resume  ·  Q: quit to menu', W / 2, H / 2 + 30, 20, '#ccd', 'center', 600);
  }
  if (game.state === 'over') {
    ctx.fillStyle = '#0006'; ctx.fillRect(VX0, VY0, VX1 - VX0, VY1 - VY0);
    const w = game.winner;
    text(w.name === 'YOU' ? 'YOU WIN!' : `${w.name} WINS!`, W / 2, 150, 100, w.col);
    const rec = WINS[S.mode], online = isOnline();
    text(online ? `Record  You ${rec[0]} – ${rec[1]} Rival` : `Record  ${rec[0]} – ${rec[1]}`, W / 2, 225, 24, '#ccd', 'center', 700);
    if (game.endT > 30) {
      const s = !online ? 'Enter: rematch  ·  Esc: menu' : net.role === 'join' && net.rm ? 'Rematch requested…' : 'Enter: rematch  ·  Esc: leave';
      text(s, W / 2, 265, 22, '#fff', 'center', 700);
      if (online && net.role === 'host' && net.rm) text('Rival wants a rematch!', W / 2, 300, 20, '#ffd35a', 'center', 700);
    }
    drawFighter(w);
  }
  if (net.quitAsk && isOnline()) {
    ctx.fillStyle = '#0009'; ctx.fillRect(VX0, VY0, VX1 - VX0, VY1 - VY0);
    text('LEAVE MATCH?', W / 2, H / 2 - 40, 80);
    text("Q: leave  ·  Esc: keep playing   (online matches don't pause)", W / 2, H / 2 + 30, 20, '#ccd', 'center', 600);
  }
}

// ---------- loop ----------
let last = performance.now(), acc = 0;
const STEP = 1000 / 60;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
