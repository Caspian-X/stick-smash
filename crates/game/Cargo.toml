[package]
name = "game"
description = "Stick Smash Bevy app: rendering, input, audio, menus."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "stick-smash"
path = "src/main.rs"

[dependencies]
sim = { workspace = true, features = ["fs"] }
bevy = { workspace = true, features = ["system_font_discovery", "wav"] }
bevy_egui.workspace = true
render.workspace = true
editor.workspace = true
pads.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true

[features]
# Faster incremental builds while developing: `cargo run --features dev`.
dev = ["bevy/dynamic_linking"]

[lints]
workspace = true
